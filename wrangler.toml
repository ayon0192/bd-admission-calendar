name = "bdac"
main = "./workers/assistant.mjs"
compatibility_date = "2026-11-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "AssistantRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AssistantRateLimiter"]
